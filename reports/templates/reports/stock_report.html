<!DOCTYPE html>
<html>
<head>
    <title>Stock Report - {{ report_date|date:"Y-m-d" }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; color: #333; }
        h2 { color: #555; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .total { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Stock Report</h1>
    <p><strong>Date:</strong> {{ report_date|date:"F j, Y" }}</p>

    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>SKU</th>
                <th>Name</th>
                <th>Quantity</th>
                <th>UOM</th>
            </tr>
        </thead>
        <tbody>
            {% for item in stock_data %}
            <tr>
                <td>{{ item.category }}</td>
                <td>{{ item.sku }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.quantity }}</td>
                <td>{{ item.uom }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No stock items found for the selected categories.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
